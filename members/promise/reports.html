<!DOCTYPE html>
<!-- Owner: Promise. This page shows stock value and reorder levels. -->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Inventory Report</title>
    <!-- Use the same visual style as the main inventory page. -->
    <link rel="stylesheet" href="/members/daniel/style.css">
  </head>
  <body>
    <h1>🧾 Stock report</h1>
    <p class="mut"><a href="/">← Main page</a></p>

    <section class="panel">
      <h2>Stock value and reorder levels</h2>
      <table>
        <thead>
          <tr>
            <th>Product</th><th>SKU</th><th>Stock</th>
            <th>Threshold</th><th>Value</th><th>Supplier</th>
          </tr>
        </thead>
        <tbody id="report-rows">
          <tr><td colspan="6">Loading…</td></tr>
        </tbody>
      </table>
      <button type="button" onclick="window.print()">Print report</button>
    </section>

    <script>
      // Load shared inventory data, then fill the report table.
      let DATA = { products: [] };

      fetch("/members/cynthia/data.json")
        .then(response => response.json())
        .then(data => {
          DATA = data;
          render();
        });

      // Build one report row for every product in the data file.
      function render() {
        const rows = DATA.products.map(product => `
          <tr>
            <td>${product.name}</td>
            <td>${product.sku || ""}</td>
            <td>${product.stock} ${product.stock <= product.threshold
              ? '<span class="tag low">LOW</span>'
              : '<span class="tag ok">ok</span>'}</td>
            <td>${product.threshold}</td>
            <td>${(product.stock * product.price).toLocaleString()}</td>
            <td>${product.supplier || "—"}</td>
          </tr>`).join("");

        document.getElementById("report-rows").innerHTML = rows
          || '<tr><td colspan="6">No products yet.</td></tr>';
      }
    </script>
  </body>
</html>
