<!DOCTYPE html>
<!-- Sam: main inventory page structure. -->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Inventory &amp; Reorder System</title>
    <link rel="stylesheet" href="/members/daniel/style.css">
  </head>
  <body>
    <header>
      <h1>📦 Inventory &amp; Reorder System</h1>
      <p class="mut">Manage stock</p>
    </header>
    <main>
      <p id="app-message" class="app-status connecting" role="status" aria-live="polite">Loading inventory…</p>
      <section class="panel">
        <h2>⚠️ Low-stock alerts</h2>
        <ul id="alert-list" aria-live="polite"><li>Loading…</li></ul>
      </section>
      <section class="panel">
        <h2>Add a product</h2>
        <form class="row" id="add-product">
          <input name="name" placeholder="Product name *" required>
          <input name="sku" placeholder="SKU">
          <input name="price" type="number" min="0" step="0.01" placeholder="Price">
          <input name="stock" type="number" min="0" placeholder="Stock">
          <input name="threshold" type="number" min="0" placeholder="Low-stock threshold">
          <input name="supplier" placeholder="Supplier">
          <button type="submit">Add product</button>
        </form>
      </section>
      <section class="panel">
        <h2>Products</h2>
        <table>
          <thead><tr><th>#</th><th>Product</th><th>Stock</th><th>Threshold</th><th>Price</th><th>Supplier</th></tr></thead>
          <tbody id="product-rows"></tbody>
        </table>
        <p class="mut">Inventory changes are saved to the shared data file.</p>
      </section>
      <section class="panel">
        <h2>Record a stock movement</h2>
        <form class="row" id="add-movement">
          <select id="movement-product" name="product_id" aria-label="Product"></select>
          <input name="qty" type="number" placeholder="+ restock / − sold or damaged" required>
          <input name="reason" placeholder="Reason">
          <input name="by" placeholder="Your name">
          <button type="submit">Record</button>
        </form>
        <table>
          <thead><tr><th>Date</th><th>Product</th><th>Qty</th><th>Reason</th><th>By</th></tr></thead>
          <tbody id="movement-rows"></tbody>
        </table>
      </section>
    </main>
    <script type="module" src="/members/peter/app.js"></script>
  </body>
</html>
